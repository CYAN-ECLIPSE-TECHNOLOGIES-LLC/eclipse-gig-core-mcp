[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eclipse-gig-core"
version = "0.1.0"
description = "Eclipse Gig Core MCP — the shared core of the Eclipse gig adapter family: one canonical, owner-approved, hash-bound Task Brief; quote normalization to face price + itemized fees + one all-in total; and the mandate hire gate. Fixtures and evaluation only: no live platform call, no hire executed, no payment moved."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cyan Eclipse Technologies LLC" },
]
keywords = ["mcp", "model-context-protocol", "gig-economy", "task-marketplace", "procurement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://cetech.ai"
Repository = "https://github.com/CYAN-ECLIPSE-TECHNOLOGIES-LLC/eclipse-gig-core-mcp"
Vendor = "https://cetech.ai"

[project.scripts]
eclipse-gig-core = "server:main"

# Version lockstep: this version, the VERSION file, server.json, and the
# server.py docstring all read 0.1.0 — bump them together.
# Flat layout: the runtime is the top-level server.py module. Runtime
# data read beside server.py (Path(__file__).parent / ...) is
# force-included at the same relative path in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"bazaar-manifest.json" = "bazaar-manifest.json"

[tool.hatch.build.targets.sdist.force-include]
"server.py" = "server.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
